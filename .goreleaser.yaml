version: 2
project_name: fencepost
dist: dist/goreleaser
builds:
  - main: ./cmd/fencepost
    binary: fencepost
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/RamazanKara/fencepost/internal/version.Version=0.2.0 -X github.com/RamazanKara/fencepost/internal/version.Commit={{ .FullCommit }}{{ if .IsSnapshot }}-snapshot{{ end }} -X github.com/RamazanKara/fencepost/internal/version.Date={{ .Date }}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]
checksum:
  name_template: SHA256SUMS
snapshot:
  version_template: 0.2.0-snapshot
changelog:
  disable: true
release:
  disable: true
